[package]
name = "omni-scan"
version = "0.1.0"
description = "OMNI Scan mobile shell"
edition = "2021"

[lib]
name = "omni_scan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

